<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>题库编辑｜真心话大冒险</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",PingFangSC,sans-serif}
body{background:#fff1ec;padding:20px 16px}
.wrap{max-width:760px;margin:0 auto}
h1{text-align:center;color:#d45d56;margin-bottom:20px;font-size:26px}
.panel{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 20px rgba(212,93,86,.12)}
h2{color:#c4524c;margin-bottom:14px;font-size:20px}
textarea{width:100%;min-height:160px;padding:14px;border:1px solid #ffc9bc;border-radius:12px;font-size:15px;line-height:1.6}
.btn{border:none;padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-right:10px;margin-top:12px}
.btn-save{background:#ff756b;color:#fff}
.btn-back{background:#ffe1d8;color:#804844}
.tip{margin-top:10px;color:#b46560;font-size:14px}
@media(max-width:600px){
    textarea{min-height:130px}
}
</style>
</head>
<body>
<div class="wrap">
    <h1>📝 题库编辑</h1>

    <div class="panel">
        <h2>💖 真心话（一行一条）</h2>
        <textarea id="truthText"></textarea>
    </div>
    <div class="panel">
        <h2>🔥 大冒险（一行一条）</h2>
        <textarea id="dareText"></textarea>
    </div>

    <div class="panel">
        <button class="btn btn-save" id="saveBtn">💾 保存题库到云端</button>
        <button class="btn btn-back" onclick="location.href='index.html'">← 返回抽取页面</button>
        <div class="tip">保存后，抽取页面点【重新加载题库】更新题目</div>
    </div>
</div>

<script>
// ========= Supabase配置，和index保持一致 =========
const SUPABASE_URL = "https://bwhqzwtzlwlpmqhodntc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TEcDxR-JXpacYv82NPdF8w_T1XW0HRA";
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let dataStore = {};

//加载云端数据
async function loadData(){
    const {data,error}=await supabaseClient.from("love_game_data").select("*").eq("id",1).single();
    if(error){
        alert("读取失败："+error.message);
        return;
    }
    dataStore = data;
    document.getElementById("truthText").value = (data.truth_list||[]).join("\n");
    document.getElementById("dareText").value = (data.dare_list||[]).join("\n");
}

//保存
document.getElementById("saveBtn").onclick = async function(){
    const truthRaw = document.getElementById("truthText").value;
    const dareRaw = document.getElementById("dareText").value;
    const truthArr = truthRaw.split("\n").filter(x=>x.trim()!=='');
    const dareArr = dareRaw.split("\n").filter(x=>x.trim()!=='');

    const {error}=await supabaseClient.from("love_game_data").update({
        truth_list:truthArr,
        dare_list:dareArr,
        truth_picked:dataStore.truth_picked||[],
        dare_picked:dataStore.dare_picked||[]
    }).eq("id",1);

    if(error){
        alert("保存失败："+error.message);
    }else{
        alert("✅题库保存成功！");
    }
};

//页面载入
loadData();
</script>
</body>
</html>
